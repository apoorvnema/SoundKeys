name: Build & Release Executables

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows App (Portable & Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build and Package Executables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Upload Build Artifacts (CI Run Summary)
        uses: actions/upload-artifact@v4
        with:
          name: SoundKeys-Windows-Builds
          path: |
            release/*.exe
          retention-days: 30

      - name: Create / Update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v2.1.0' }}
          name: "SoundKeys ${{ github.ref_name || 'v2.1.0' }} Release"
          body: |
            ## SoundKeys v2.1.0 Release

            Tactile audio feedback, analytics engine, customizable sound themes, Typing Test with Gemini AI, and full Keyboard Layout Manager with per-key mute and sound overrides.

            ### Included Executables:
            - **SoundKeys-2.1.0-portable.exe** (Standalone portable executable, no install required)
            - **SoundKeys Setup 2.1.0.exe** (Windows NSIS Installer)
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
