name: Build & Release Executables

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows App (Portable & Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build and Package Executables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Upload Build Artifacts (CI Run Summary)
        uses: actions/upload-artifact@v4
        with:
          name: SoundKeys-Windows-Builds
          path: |
            release/*.exe
          retention-days: 30

      - name: Extract package version
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create / Update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.pkg.outputs.tag_name }}
          name: "SoundKeys v${{ steps.pkg.outputs.version }} Release"
          body: |
            ## SoundKeys v${{ steps.pkg.outputs.version }} Release

            Tactile audio feedback and sound effects for every keypress on Windows.

            ### Included Executables:
            - **SoundKeys-${{ steps.pkg.outputs.version }}-portable.exe** (Standalone portable executable, no install required)
            - **SoundKeys Setup ${{ steps.pkg.outputs.version }}.exe** (Windows NSIS Installer)
          files: |
            release/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

